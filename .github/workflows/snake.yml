name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '27 8 * * *'
permissions:
  contents: write
jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: PaoloDuenas
          outputs: |
            dist/snake.svg?color_snake=#9366da
            dist/snake-dark.svg?palette=github-dark&color_snake=#b393f4
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: snake-output
          publish_dir: ./dist